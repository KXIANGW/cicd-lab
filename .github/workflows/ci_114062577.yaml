name: CI_114062577

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read # 讀取 workflow 資訊

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier format check
        run: npm run format:check

      - name: Run tests
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: reports/vitest-junit.xml
          if-no-files-found: warn

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          artifact: vitest-junit
          path: '*.xml'
          name: Vitest Test Results
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true

      - name: Write job summary
        if: always()
        run: |
          if [ ! -f reports/vitest-junit.xml ]; then
            echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo "No test report found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TESTS=$(grep -oP 'tests="\K[^"]+' reports/vitest-junit.xml | head -1)
          FAILURES=$(grep -oP 'failures="\K[^"]+' reports/vitest-junit.xml | head -1)
          ERRORS=$(grep -oP 'errors="\K[^"]+' reports/vitest-junit.xml | head -1)
          SKIPPED=$(grep -oP 'skipped="\K[^"]+' reports/vitest-junit.xml | head -1)
          SKIPPED=${SKIPPED:-0}
          PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))

          if [ "$FAILURES" -eq 0 ] && [ "$ERRORS" -eq 0 ]; then
            STATUS="passed"
          else
            STATUS="failed"
          fi

          {
            echo "## Test Results — $STATUS"
            echo ""
            echo "| Total | Passed | Failed | Errors | Skipped |"
            echo "|:-----:|:------:|:------:|:------:|:-------:|"
            echo "| $TESTS | $PASSED | $FAILURES | $ERRORS | $SKIPPED |"
          } >> "$GITHUB_STEP_SUMMARY"
